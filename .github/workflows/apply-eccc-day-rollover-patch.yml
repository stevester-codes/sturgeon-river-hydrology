name: Apply ECCC day rollover patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-eccc-day-rollover-patch.yml'
      - 'patch_eccc_day_rollover.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-eccc-day-rollover-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python patch_eccc_day_rollover.py
      - name: Compile changed files
        run: |
          python -m py_compile \
            qpf_forecast_v2.py \
            medium_range_qpf.py \
            operational_update_probe.py
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qpf_forecast_v2.py medium_range_qpf.py operational_update_probe.py
          if git diff --cached --quiet; then
            echo 'No production changes required.'
            exit 0
          fi
          git commit -m 'Handle ECCC UTC-day rollover without false QPF degradation'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

# Triggered after the workflow became available on the default branch.
