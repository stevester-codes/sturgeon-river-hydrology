name: Sturgeon hydrology data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'output/**'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sturgeon-hydrology
  cancel-in-progress: true

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore hydrology grid cache
        uses: actions/cache@v4
        with:
          path: grid_cache
          key: sturgeon-grid-cache-v3-${{ runner.os }}
          restore-keys: |
            sturgeon-grid-cache-v3-${{ runner.os }}
            sturgeon-grid-cache-v2-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test parser
        run: python test_parsing.py
      - name: Retrieve hydrometric and HRDPA data
        run: |
          rm -rf sturgeon_pipeline_output output/latest
          python sturgeon_pipeline.py --start-date 2026-06-01 --contact stevester-codes@users.noreply.github.com
      - name: Generate compact summaries
        run: python summarize_output.py
      - name: Calibrate rainfall-runoff events
        run: python calibrate_events.py
      - name: Process historical full-grid rainfall
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set -o pipefail
          python spatial_qpf.py 2>&1 | tee sturgeon_pipeline_output/logs/spatial_qpf.log
          echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/spatial_qpf.exitcode
      - name: Build censor-aware spatial calibration
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set -o pipefail
          python calibrate_events_v2.py 2>&1 | tee sturgeon_pipeline_output/logs/calibrate_events_v2.log
          echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/calibrate_events_v2.exitcode
      - name: Retrieve corrected deterministic and ensemble QPF
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set -o pipefail
          python qpf_forecast_v2.py 2>&1 | tee sturgeon_pipeline_output/logs/qpf_forecast_v2.log
          echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/qpf_forecast_v2.exitcode
      - name: Validate QPF accumulation semantics
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set -o pipefail
          python validate_qpf.py 2>&1 | tee sturgeon_pipeline_output/logs/validate_qpf.log
          echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/validate_qpf.exitcode
      - name: Aggregate cumulative QPF footprints
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/validate_qpf.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping horizon aggregation because QPF validation failed.' | tee sturgeon_pipeline_output/logs/aggregate_qpf_horizons.log
            echo 3 > sturgeon_pipeline_output/logs/aggregate_qpf_horizons.exitcode
          else
            set -o pipefail
            python aggregate_qpf_horizons.py 2>&1 | tee sturgeon_pipeline_output/logs/aggregate_qpf_horizons.log
            echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/aggregate_qpf_horizons.exitcode
          fi
      - name: Translate QPF into river impacts
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/validate_qpf.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping impact translation because QPF validation failed.' | tee sturgeon_pipeline_output/logs/forecast_impacts.log
            echo 3 > sturgeon_pipeline_output/logs/forecast_impacts.exitcode
          else
            set -o pipefail
            python forecast_impacts.py 2>&1 | tee sturgeon_pipeline_output/logs/forecast_impacts.log
            echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/forecast_impacts.exitcode
          fi
      - name: Calibrate 05EA002-to-Starkey timing
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set -o pipefail
          python starkey_routing.py 2>&1 | tee sturgeon_pipeline_output/logs/starkey_routing.log
          echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/starkey_routing.exitcode
      - name: Prepare latest output
        if: always()
        run: |
          mkdir -p output/latest
          if [ -d sturgeon_pipeline_output ]; then cp -a sturgeon_pipeline_output/. output/latest/; fi
          ZIP=$(ls -1t sturgeon_pipeline_output_*.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then cp "$ZIP" output/latest/sturgeon_pipeline_latest.zip; fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > output/latest/workflow_completed_utc.txt
      - name: Upload complete data package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sturgeon-hydrology-latest
          path: |
            output/latest
            sturgeon_pipeline_output_*.zip
          retention-days: 30
          if-no-files-found: warn
      - name: Commit latest outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f output/latest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Sturgeon hydrology data [skip ci]'
          git push
