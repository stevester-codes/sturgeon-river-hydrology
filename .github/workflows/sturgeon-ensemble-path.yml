name: Sturgeon ensemble river paths

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sturgeon-ensemble-path.yml'
      - 'ensemble_path_forecast.py'
      - 'forecast_impacts_v2.py'

permissions:
  contents: write

concurrency:
  group: sturgeon-ensemble-river-paths
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile forecast_impacts_v2.py ensemble_path_forecast.py
      - name: Seed latest operational output
        run: |
          test -f output/latest/spatial/geps_qpf_by_subarea.csv
          test -f output/latest/spatial/medium_range_qpf.json
          test -f output/latest/forecast_v2/forecast_impacts_v2.json
          test -f output/latest/calibration_v2/event_response_v2.csv
          rm -rf sturgeon_pipeline_output
          cp -a output/latest sturgeon_pipeline_output
      - name: Translate GEPS rainfall into river paths
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set -o pipefail
          python ensemble_path_forecast.py 2>&1 | tee sturgeon_pipeline_output/logs/ensemble_path_forecast.log
          echo ${PIPESTATUS[0]} > sturgeon_pipeline_output/logs/ensemble_path_forecast.exitcode
      - name: Commit ensemble path output
        run: |
          rm -rf output/latest/forecast_v2 output/latest/logs/ensemble_path_forecast.log output/latest/logs/ensemble_path_forecast.exitcode
          mkdir -p output/latest/forecast_v2 output/latest/logs
          cp -a sturgeon_pipeline_output/forecast_v2/. output/latest/forecast_v2/
          cp sturgeon_pipeline_output/logs/ensemble_path_forecast.log output/latest/logs/
          cp sturgeon_pipeline_output/logs/ensemble_path_forecast.exitcode output/latest/logs/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f output/latest/forecast_v2 output/latest/logs/ensemble_path_forecast.log output/latest/logs/ensemble_path_forecast.exitcode
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Sturgeon ensemble river paths [skip ci]'
          git pull --rebase origin main
          git push
