name: Sturgeon historical archive probes

on:
  workflow_dispatch:
  schedule:
    - cron: '47 12 * * *'
  push:
    branches: [main]
    paths:
      - 'rdpa_archive_probe.py'
      - 'wateroffice_archive_probe.py'
      - 'historical_gauge_analysis.py'
      - 'historical_rdpa_pairing.py'
      - 'historical_rdpa_wcs_pairing.py'
      - 'historical_rdpa_model_selection.py'
      - 'spatial_qpf.py'
      - '.github/workflows/sturgeon-rdpa-archive-probe.yml'
      - 'forecast_impacts_v2.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: sturgeon-historical-archive-probes
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore historical RDPA cache
        uses: actions/cache@v4
        with:
          path: |
            archive_cache
            grid_cache/basins
          key: sturgeon-historical-rdpa-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sturgeon-historical-rdpa-${{ runner.os }}-
            sturgeon-historical-rdpa-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile archive tools
        run: |
          python -m py_compile \
            rdpa_archive_probe.py \
            wateroffice_archive_probe.py \
            historical_gauge_analysis.py \
            historical_rdpa_pairing.py \
            historical_rdpa_wcs_pairing.py \
            historical_rdpa_model_selection.py \
            spatial_qpf.py
      - name: Prepare archive output
        run: |
          rm -rf output/archive_probe
          mkdir -p output/archive_probe
      - name: Probe archived RDPA coverage
        continue-on-error: true
        run: |
          set +e
          python rdpa_archive_probe.py \
            --datetime '2026-07-01T00:00:00Z' \
            --bbox=-115.2,52.9,-113.0,54.2 \
            --output output/archive_probe/rdpa_probe.json
          CODE=$?
          echo "$CODE" > output/archive_probe/rdpa_probe.exitcode
          exit "$CODE"
      - name: Probe 18 month WaterOffice unit values
        continue-on-error: true
        run: |
          set +e
          python wateroffice_archive_probe.py \
            --station 05EA002 \
            --months 18 \
            --output output/archive_probe/wateroffice_probe.json
          CODE=$?
          echo "$CODE" > output/archive_probe/wateroffice_probe.exitcode
          exit "$CODE"
      - name: Analyze historical target stage and recession
        continue-on-error: true
        run: |
          set +e
          python historical_gauge_analysis.py \
            --months 18 \
            --output output/archive_probe/historical_gauge_analysis.json
          CODE=$?
          echo "$CODE" > output/archive_probe/historical_gauge_analysis.exitcode
          exit "$CODE"
      - name: Pair historical recessions with archived RDPA
        continue-on-error: true
        run: |
          set +e
          python historical_rdpa_wcs_pairing.py \
            --months 18 \
            --workers 4 \
            --lookback-hours 168 \
            --cache archive_cache/historical_rdpa_05EA002.csv \
            --output output/archive_probe/historical_rdpa_pairing.json \
            --pairs-output output/archive_probe/historical_rdpa_pairs.csv
          CODE=$?
          echo "$CODE" > output/archive_probe/historical_rdpa_pairing.exitcode
          exit "$CODE"
      - name: Select precipitation-screened recession sensitivity
        continue-on-error: true
        run: |
          set +e
          python historical_rdpa_model_selection.py \
            --pairing output/archive_probe/historical_rdpa_pairing.json \
            --output output/archive_probe/historical_rdpa_model_selection.json
          CODE=$?
          echo "$CODE" > output/archive_probe/historical_rdpa_model_selection.exitcode
          exit "$CODE"
      - name: Summarize archive status
        if: always()
        run: |
          RDPA=$(cat output/archive_probe/rdpa_probe.exitcode 2>/dev/null || echo missing)
          WATER=$(cat output/archive_probe/wateroffice_probe.exitcode 2>/dev/null || echo missing)
          ANALYSIS=$(cat output/archive_probe/historical_gauge_analysis.exitcode 2>/dev/null || echo missing)
          PAIRING=$(cat output/archive_probe/historical_rdpa_pairing.exitcode 2>/dev/null || echo missing)
          SELECTION=$(cat output/archive_probe/historical_rdpa_model_selection.exitcode 2>/dev/null || echo missing)
          cat > output/archive_probe/probe_status.json <<EOF
          {
            "rdpa_exitcode": "${RDPA}",
            "wateroffice_exitcode": "${WATER}",
            "historical_gauge_analysis_exitcode": "${ANALYSIS}",
            "historical_rdpa_pairing_exitcode": "${PAIRING}",
            "historical_rdpa_model_selection_exitcode": "${SELECTION}",
            "all_passed": $([ "$RDPA" = "0" ] && [ "$WATER" = "0" ] && [ "$ANALYSIS" = "0" ] && [ "$PAIRING" = "0" ] && [ "$SELECTION" = "0" ] && echo true || echo false)
          }
          EOF
      - name: Upload archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sturgeon-historical-archive-probes
          path: output/archive_probe
          retention-days: 14
      - name: Publish archive results
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/sturgeon-archive-probe
          cp -a output/archive_probe /tmp/sturgeon-archive-probe
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf output/archive_probe
            mkdir -p output
            cp -a /tmp/sturgeon-archive-probe output/archive_probe
            git add -f output/archive_probe
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'Update historical archive probes [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Enforce archive success
        if: ${{ always() && !cancelled() }}
        run: |
          test "$(cat output/archive_probe/rdpa_probe.exitcode 2>/dev/null || echo 1)" = "0"
          test "$(cat output/archive_probe/wateroffice_probe.exitcode 2>/dev/null || echo 1)" = "0"
          test "$(cat output/archive_probe/historical_gauge_analysis.exitcode 2>/dev/null || echo 1)" = "0"
          test "$(cat output/archive_probe/historical_rdpa_pairing.exitcode 2>/dev/null || echo 1)" = "0"
          test "$(cat output/archive_probe/historical_rdpa_model_selection.exitcode 2>/dev/null || echo 1)" = "0"
