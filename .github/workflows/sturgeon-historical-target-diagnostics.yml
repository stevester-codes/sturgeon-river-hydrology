name: Sturgeon historical response-target diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '47 14 * * *'
  push:
    branches: [main]
    paths:
      - 'historical_response_target_diagnostics.py'
      - 'historical_spatial_peak_reanalysis.py'
      - 'historical_spatial_event_backfill.py'
      - 'historical_rdpa_pairing.py'
      - '.github/workflows/sturgeon-historical-target-diagnostics.yml'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: sturgeon-historical-response-target-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile target diagnostics
        run: |
          python -m py_compile \
            historical_response_target_diagnostics.py \
            historical_spatial_peak_reanalysis.py \
            historical_spatial_event_backfill.py \
            historical_rdpa_pairing.py
      - name: Verify peak-reanalysis inputs
        run: |
          test -f output/historical_event_backfill/historical_spatial_events_peak_reanalysis.csv
          test -f output/archive_probe/historical_rdpa_pairs.csv
      - name: Compare stage and discharge response targets
        run: |
          set -o pipefail
          python historical_response_target_diagnostics.py \
            --months 18 \
            --events output/historical_event_backfill/historical_spatial_events_peak_reanalysis.csv \
            --pairs output/archive_probe/historical_rdpa_pairs.csv \
            --output output/historical_event_backfill/historical_response_target_diagnostics.json \
            --csv-output output/historical_event_backfill/historical_response_target_diagnostics.csv \
            2>&1 | tee output/historical_event_backfill/target_diagnostics.log
          echo "${PIPESTATUS[0]}" > output/historical_event_backfill/target_diagnostics.exitcode
      - name: Validate shadow diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('output/historical_event_backfill')
          result = json.loads((root / 'historical_response_target_diagnostics.json').read_text())
          if result.get('status') != 'historical_response_target_diagnostics_complete':
              raise RuntimeError('response-target diagnostics did not complete')
          if result.get('mode') != 'shadow_only_no_automatic_promotion':
              raise RuntimeError('response-target diagnostics are not shadow-only')
          if result.get('target_recommendation', {}).get('automatic_promotion_enabled') is not False:
              raise RuntimeError('automatic target promotion is not explicitly disabled')
          print('Historical response-target diagnostics validation passed.')
          PY
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sturgeon-historical-response-target-diagnostics
          path: output/historical_event_backfill
          retention-days: 30
          if-no-files-found: warn
      - name: Publish target diagnostics
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/sturgeon-historical-event-backfill
          cp -a output/historical_event_backfill /tmp/sturgeon-historical-event-backfill
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf output/historical_event_backfill
            mkdir -p output
            cp -a /tmp/sturgeon-historical-event-backfill output/historical_event_backfill
            git add -f output/historical_event_backfill
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'Update historical response-target diagnostics [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Enforce successful diagnostics
        if: ${{ always() && !cancelled() }}
        run: |
          test "$(cat output/historical_event_backfill/target_diagnostics.exitcode 2>/dev/null || echo 1)" = "0"
