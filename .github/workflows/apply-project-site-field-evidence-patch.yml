name: Apply project-site field evidence patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apply_project_site_field_evidence_patch.py'

permissions:
  contents: write

concurrency:
  group: apply-project-site-field-evidence-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python apply_project_site_field_evidence_patch.py
      - name: Compile changed Python files
        run: |
          python -m py_compile \
            operational_readiness.py \
            calibration_health.py \
            project_site_recession_shadow.py
      - name: Commit patched production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operational_readiness.py calibration_health.py .github/workflows/sturgeon-operational.yml
          if git diff --cached --quiet; then
            echo 'No production patch changes required.'
            exit 0
          fi
          git commit -m 'Integrate provisional project-site field elevations'
          git push origin HEAD:main
