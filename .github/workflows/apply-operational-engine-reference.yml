name: Apply operational synthesis engine reference

on:
  push:
    branches: [main]
    paths:
      - 'revise_operational_engine_reference.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-operational-engine-reference
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update workflow
        run: python revise_operational_engine_reference.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sturgeon-operational.yml
          git commit -m 'Track and compile risk-integrated synthesis engine' || exit 0
          git pull --rebase origin main
          git push
