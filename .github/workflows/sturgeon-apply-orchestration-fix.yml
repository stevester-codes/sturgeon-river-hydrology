name: Apply Sturgeon workflow orchestration fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apply_workflow_orchestration_fix.py'
      - '.github/workflows/sturgeon-apply-orchestration-fix.yml'

permissions:
  contents: write

concurrency:
  group: sturgeon-apply-orchestration-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply text-safe workflow edits
        run: python apply_workflow_orchestration_fix.py
      - name: Validate edited workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          operational = Path('.github/workflows/sturgeon-operational.yml').read_text()
          shadow = Path('.github/workflows/sturgeon-historical-response-shadow.yml').read_text()
          assert "cron: '17 * * * *'" not in operational
          assert 'cancel-in-progress: false' in operational
          assert "workflows: ['Sturgeon operational forecast']" in shadow
          for name in [
              'sturgeon-historical-event-backfill.yml',
              'sturgeon-historical-peak-reanalysis.yml',
              'sturgeon-historical-target-diagnostics.yml',
              'sturgeon-historical-censored-response.yml',
          ]:
              text = Path('.github/workflows', name).read_text()
              assert 'schedule:' not in text.split('permissions:', 1)[0]
          print('Workflow edit validation passed.')
          PY
      - name: Commit orchestration changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sturgeon-operational.yml \
            .github/workflows/sturgeon-historical-response-shadow.yml \
            .github/workflows/sturgeon-historical-event-backfill.yml \
            .github/workflows/sturgeon-historical-peak-reanalysis.yml \
            .github/workflows/sturgeon-historical-target-diagnostics.yml \
            .github/workflows/sturgeon-historical-censored-response.yml
          if git diff --cached --quiet; then
            echo 'Orchestration fix is already applied.'
            exit 0
          fi
          git commit -m 'Consolidate Sturgeon workflow orchestration [skip ci]'
          git push origin HEAD:main
