name: Patch synthesis observation age

on:
  push:
    branches: [main]
    paths:
      - 'patch_synthesis_observation_age.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-synthesis-observation-age
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('forecast_synthesis_engine.py')
          s = p.read_text()
          anchor = '''def parse_date(value: Any) -> date | None:\n'''
          helper = '''def parse_datetime(value: Any) -> datetime | None:\n    if not value:\n        return None\n    try:\n        parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))\n        if parsed.tzinfo is None:\n            parsed = parsed.replace(tzinfo=timezone.utc)\n        return parsed.astimezone(timezone.utc)\n    except (TypeError, ValueError):\n        return None\n\n\n'''
          if 'def parse_datetime(value: Any)' not in s:
              s = s.replace(anchor, helper + anchor, 1)
          old = '''    freshness_age = finite(nested(readiness, "observation_freshness", "age_hours"))\n    freshness_status = nested(readiness, "observation_freshness", "status")\n'''
          new = '''    stored_freshness_age = finite(nested(readiness, "observation_freshness", "age_hours"))\n    stage_time = parse_datetime(latest_stage_utc)\n    freshness_age = (\n        max(0.0, (generated - stage_time).total_seconds() / 3600.0)\n        if stage_time is not None\n        else stored_freshness_age\n    )\n    freshness_status = nested(readiness, "observation_freshness", "status")\n'''
          if old not in s:
              raise RuntimeError('freshness assignment block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Compile and commit
        run: |
          python -m py_compile forecast_synthesis.py forecast_synthesis_engine.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast_synthesis_engine.py
          git commit -m 'Recompute observation age at synthesis time' || exit 0
          git pull --rebase origin main
          git push
