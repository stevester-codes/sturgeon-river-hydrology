name: Verify forecast synthesis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forecast-synthesis.yml'
      - 'forecast_synthesis.py'
      - 'historical_response_shadow_forecast.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-forecast-synthesis
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum dependencies
        run: pip install numpy
      - name: Compile synthesis code
        run: python -m py_compile forecast_synthesis.py historical_response_shadow_forecast.py
      - name: Run against current validated package
        run: |
          rm -rf sturgeon_pipeline_output
          cp -a output/latest sturgeon_pipeline_output
          mkdir -p sturgeon_pipeline_output/diagnostics
          python historical_response_shadow_forecast.py \
            --forecast sturgeon_pipeline_output/forecast_v2/forecast_impacts_v2.json \
            --model output/historical_event_backfill/historical_censored_response_model.json \
            --output sturgeon_pipeline_output/diagnostics/historical_response_shadow_current.json
          python forecast_synthesis.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('sturgeon_pipeline_output')
          synthesis = json.loads((root / 'forecast_v2/forecast_synthesis.json').read_text())
          manifest = json.loads((root / 'run_manifest.json').read_text())
          assert synthesis['status'] == 'operational_forecast_synthesis'
          assert synthesis['run_id'] == manifest['run_id']
          assert (root / 'forecast_v2/forecast_brief.md').exists()
          assert (root / 'history/forecast_history.csv').exists()
          shadow = synthesis['evidence_reconciliation']['historical_response_shadow']
          assert 'material_disagreement' in shadow
          assert 'historical_response_shadow_sensitivity_date' in synthesis['working_forecast']
          print(json.dumps({
              'run_id': synthesis['run_id'],
              'decision': synthesis['decision'],
              'working_forecast': synthesis['working_forecast'],
              'historical_response_shadow': shadow,
          }, indent=2))
          PY
      - name: Publish verification marker
        run: |
          mkdir -p output/synthesis_verification
          cp sturgeon_pipeline_output/forecast_v2/forecast_synthesis.json output/synthesis_verification/forecast_synthesis.json
          cp sturgeon_pipeline_output/forecast_v2/forecast_brief.md output/synthesis_verification/forecast_brief.md
          cp sturgeon_pipeline_output/run_manifest.json output/synthesis_verification/run_manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f output/synthesis_verification
          git commit -m 'Verify forecast synthesis [skip ci]' || exit 0
          git push

# Refined caution verification trigger.
