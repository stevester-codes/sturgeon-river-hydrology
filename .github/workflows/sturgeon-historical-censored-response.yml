name: Sturgeon historical censored-response model

on:
  workflow_dispatch:
  schedule:
    - cron: '57 14 * * *'
  push:
    branches: [main]
    paths:
      - 'historical_censored_response_model.py'
      - 'historical_response_target_diagnostics.py'
      - 'historical_spatial_peak_reanalysis.py'
      - '.github/workflows/sturgeon-historical-censored-response.yml'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: sturgeon-historical-censored-response
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile censored-response tools
        run: |
          python -m py_compile \
            historical_censored_response_model.py \
            historical_response_target_diagnostics.py \
            historical_spatial_peak_reanalysis.py
      - name: Verify target diagnostics input
        run: |
          test -f output/historical_event_backfill/historical_response_target_diagnostics.csv
      - name: Evaluate censored-response candidates
        run: |
          set -o pipefail
          python historical_censored_response_model.py \
            --input output/historical_event_backfill/historical_response_target_diagnostics.csv \
            --output output/historical_event_backfill/historical_censored_response_model.json \
            --predictions-output output/historical_event_backfill/historical_censored_response_predictions.csv \
            2>&1 | tee output/historical_event_backfill/censored_response.log
          echo "${PIPESTATUS[0]}" > output/historical_event_backfill/censored_response.exitcode
      - name: Validate shadow status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('output/historical_event_backfill')
          result = json.loads((root / 'historical_censored_response_model.json').read_text())
          if result.get('status') != 'historical_censored_response_model_evaluated':
              raise RuntimeError('censored-response model did not complete')
          if result.get('mode') != 'shadow_only_manual_promotion_required':
              raise RuntimeError('censored-response model is not shadow-only')
          if result.get('promotion_screen', {}).get('automatic_promotion_enabled') is not False:
              raise RuntimeError('automatic promotion is not explicitly disabled')
          print('Historical censored-response shadow validation passed.')
          PY
      - name: Upload censored-response results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sturgeon-historical-censored-response
          path: output/historical_event_backfill
          retention-days: 30
          if-no-files-found: warn
      - name: Publish censored-response results
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/sturgeon-historical-event-backfill
          cp -a output/historical_event_backfill /tmp/sturgeon-historical-event-backfill
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf output/historical_event_backfill
            mkdir -p output
            cp -a /tmp/sturgeon-historical-event-backfill output/historical_event_backfill
            git add -f output/historical_event_backfill
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'Update historical censored-response model [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Enforce successful evaluation
        if: ${{ always() && !cancelled() }}
        run: |
          test "$(cat output/historical_event_backfill/censored_response.exitcode 2>/dev/null || echo 1)" = "0"
