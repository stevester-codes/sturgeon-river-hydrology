name: Sturgeon operational forecast

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Fresh upstream data or manual reason'
        required: false
        default: 'manual refresh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sturgeon-operational.yml'
      - 'refresh_operational_base.py'
      - 'sturgeon_pipeline.py'
      - 'summarize_output.py'
      - 'qpf_forecast_v2.py'
      - 'medium_range_qpf.py'
      - 'geps_ensemble_impacts.py'
      - 'run_geps_ensemble_impacts.py'
      - 'project_threshold_ensemble.py'
      - 'starkey_wse_transfer.py'
      - 'forecast_starkey_wse.py'
      - 'operational_readiness.py'
      - 'calibration_health.py'
      - 'hysteresis_diagnostics.py'
      - 'uncertainty_sensitivity.py'
      - 'assimilation_candidates.py'
      - 'storage_state_candidate.py'
      - 'validate_qpf.py'
      - 'aggregate_qpf_horizons.py'
      - 'forecast_impacts_v2.py'
      - 'operational_update_probe.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: sturgeon-hydrology-operational
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Show refresh trigger
        run: echo "${{ inputs.trigger_reason || 'code change' }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore forecast grid cache
        uses: actions/cache@v4
        with:
          path: grid_cache
          key: sturgeon-operational-grid-v2-${{ runner.os }}
          restore-keys: |
            sturgeon-operational-grid-v2-${{ runner.os }}
            sturgeon-operational-grid-v1-${{ runner.os }}
            sturgeon-grid-cache-v3-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile-check operational scripts
        run: |
          python -m py_compile \
            sturgeon_pipeline.py \
            summarize_output.py \
            refresh_operational_base.py \
            qpf_forecast_v2.py \
            medium_range_qpf.py \
            geps_ensemble_impacts.py \
            run_geps_ensemble_impacts.py \
            project_threshold_ensemble.py \
            starkey_wse_transfer.py \
            forecast_starkey_wse.py \
            operational_readiness.py \
            calibration_health.py \
            hysteresis_diagnostics.py \
            uncertainty_sensitivity.py \
            assimilation_candidates.py \
            storage_state_candidate.py \
            validate_qpf.py \
            aggregate_qpf_horizons.py \
            forecast_impacts_v2.py
      - name: Seed working directory from calibrated output
        run: |
          test -f output/latest/calibration_v2/calibration_v2.json
          test -f output/latest/calibration_v2/event_response_v2.csv
          test -f output/latest/calibration/calibration.json
          test -f output/latest/spatial/derived_subareas.geojson
          rm -rf sturgeon_pipeline_output
          cp -a output/latest sturgeon_pipeline_output
      - name: Refresh recent gauges and observed basin rainfall
        run: |
          START=$(date -u -d '14 days ago' +%F)
          python sturgeon_pipeline.py \
            --start-date "$START" \
            --output-dir sturgeon_pipeline_output \
            --contact stevester-codes@users.noreply.github.com
      - name: Refresh current summary and rain-free projection
        run: |
          python summarize_output.py
          python refresh_operational_base.py
      - name: Estimate current project WSE from discharge
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set +e
          set -o pipefail
          python starkey_wse_transfer.py 2>&1 | tee sturgeon_pipeline_output/logs/starkey_wse_transfer.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/starkey_wse_transfer.exitcode
          exit "$CODE"
      - name: Retrieve high-resolution short-range QPF
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set +e
          set -o pipefail
          python qpf_forecast_v2.py 2>&1 | tee sturgeon_pipeline_output/logs/qpf_forecast_v2.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/qpf_forecast_v2.exitcode
          exit "$CODE"
      - name: Validate short-range QPF accumulation semantics
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set +e
          set -o pipefail
          python validate_qpf.py 2>&1 | tee sturgeon_pipeline_output/logs/validate_qpf.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/validate_qpf.exitcode
          exit "$CODE"
      - name: Aggregate short-range cumulative QPF footprints
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/validate_qpf.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping horizon aggregation because QPF validation failed.' | tee sturgeon_pipeline_output/logs/aggregate_qpf_horizons.log
            echo 3 > sturgeon_pipeline_output/logs/aggregate_qpf_horizons.exitcode
            exit 3
          fi
          set +e
          set -o pipefail
          python aggregate_qpf_horizons.py 2>&1 | tee sturgeon_pipeline_output/logs/aggregate_qpf_horizons.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/aggregate_qpf_horizons.exitcode
          exit "$CODE"
      - name: Retrieve 10-day deterministic and 16-day ensemble QPF
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set +e
          set -o pipefail
          python medium_range_qpf.py 2>&1 | tee sturgeon_pipeline_output/logs/medium_range_qpf.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/medium_range_qpf.exitcode
          exit "$CODE"
      - name: Translate short-range QPF with calibrated censor-aware model
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/validate_qpf.exitcode 2>/dev/null || echo 1)" != "0" ] || [ "$(cat sturgeon_pipeline_output/logs/aggregate_qpf_horizons.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping operational forecast because validated cumulative QPF is unavailable.' | tee sturgeon_pipeline_output/logs/forecast_impacts_v2.log
            echo 3 > sturgeon_pipeline_output/logs/forecast_impacts_v2.exitcode
            exit 3
          fi
          set +e
          set -o pipefail
          python forecast_impacts_v2.py 2>&1 | tee sturgeon_pipeline_output/logs/forecast_impacts_v2.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/forecast_impacts_v2.exitcode
          exit "$CODE"
      - name: Integrate GEPS dry central and wet river paths
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/medium_range_qpf.exitcode 2>/dev/null || echo 1)" != "0" ] || [ "$(cat sturgeon_pipeline_output/logs/forecast_impacts_v2.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping GEPS impact integration because medium-range QPF or short-range impacts failed.' | tee sturgeon_pipeline_output/logs/geps_ensemble_impacts.log
            echo 3 > sturgeon_pipeline_output/logs/geps_ensemble_impacts.exitcode
            exit 3
          fi
          set +e
          set -o pipefail
          python run_geps_ensemble_impacts.py 2>&1 | tee sturgeon_pipeline_output/logs/geps_ensemble_impacts.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/geps_ensemble_impacts.exitcode
          exit "$CODE"
      - name: Forecast project WSE and main floodplain crossing
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/starkey_wse_transfer.exitcode 2>/dev/null || echo 1)" != "0" ] || [ "$(cat sturgeon_pipeline_output/logs/geps_ensemble_impacts.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping project WSE forecast because transfer or GEPS paths failed.' | tee sturgeon_pipeline_output/logs/forecast_starkey_wse.log
            echo 3 > sturgeon_pipeline_output/logs/forecast_starkey_wse.exitcode
            exit 3
          fi
          set +e
          set -o pipefail
          python forecast_starkey_wse.py 2>&1 | tee sturgeon_pipeline_output/logs/forecast_starkey_wse.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/forecast_starkey_wse.exitcode
          exit "$CODE"
      - name: Calculate all-member project-threshold probabilities
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/forecast_starkey_wse.exitcode 2>/dev/null || echo 1)" != "0" ] || [ "$(cat sturgeon_pipeline_output/logs/geps_ensemble_impacts.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping all-member threshold probabilities because project WSE or GEPS paths failed.' | tee sturgeon_pipeline_output/logs/project_threshold_ensemble.log
            echo 3 > sturgeon_pipeline_output/logs/project_threshold_ensemble.exitcode
            exit 3
          fi
          set +e
          set -o pipefail
          python project_threshold_ensemble.py 2>&1 | tee sturgeon_pipeline_output/logs/project_threshold_ensemble.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/project_threshold_ensemble.exitcode
          exit "$CODE"
      - name: Calculate limb-aware construction readiness dates
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          if [ "$(cat sturgeon_pipeline_output/logs/project_threshold_ensemble.exitcode 2>/dev/null || echo 1)" != "0" ] || [ "$(cat sturgeon_pipeline_output/logs/forecast_starkey_wse.exitcode 2>/dev/null || echo 1)" != "0" ]; then
            echo 'Skipping construction readiness because project-threshold ensemble or project WSE failed.' | tee sturgeon_pipeline_output/logs/operational_readiness.log
            echo 3 > sturgeon_pipeline_output/logs/operational_readiness.exitcode
            exit 3
          fi
          set +e
          set -o pipefail
          python operational_readiness.py 2>&1 | tee sturgeon_pipeline_output/logs/operational_readiness.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/operational_readiness.exitcode
          exit "$CODE"
      - name: Screen new calibration candidates
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set +e
          set -o pipefail
          python assimilation_candidates.py 2>&1 | tee sturgeon_pipeline_output/logs/assimilation_candidates.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/assimilation_candidates.exitcode
          exit "$CODE"
      - name: Test storage-state candidate in shadow mode
        continue-on-error: true
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          set +e
          set -o pipefail
          python storage_state_candidate.py 2>&1 | tee sturgeon_pipeline_output/logs/storage_state_candidate.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > sturgeon_pipeline_output/logs/storage_state_candidate.exitcode
          exit "$CODE"
      - name: Validate operational package consistency
        if: always()
        run: |
          mkdir -p sturgeon_pipeline_output/logs
          : > sturgeon_pipeline_output/logs/operational_validation.log
          STATUS=0
          for name in \
            qpf_forecast_v2 \
            validate_qpf \
            aggregate_qpf_horizons \
            medium_range_qpf \
            forecast_impacts_v2 \
            geps_ensemble_impacts \
            starkey_wse_transfer \
            forecast_starkey_wse \
            project_threshold_ensemble \
            operational_readiness; do
            CODE=$(cat "sturgeon_pipeline_output/logs/${name}.exitcode" 2>/dev/null || echo missing)
            if [ "$CODE" != "0" ]; then
              echo "${name} exit code is ${CODE}" | tee -a sturgeon_pipeline_output/logs/operational_validation.log
              STATUS=1
            fi
          done
          for name in assimilation_candidates storage_state_candidate; do
            CODE=$(cat "sturgeon_pipeline_output/logs/${name}.exitcode" 2>/dev/null || echo missing)
            echo "shadow diagnostic ${name} exit code is ${CODE}" | tee -a sturgeon_pipeline_output/logs/operational_validation.log
          done

          python - <<'PY' || STATUS=1
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('sturgeon_pipeline_output')
          files = {
              'forecast': root / 'forecast_v2/forecast_impacts_v2.json',
              'ensemble': root / 'forecast_v2/ensemble_paths_v2.json',
              'transfer': root / 'routing/starkey_wse_transfer.json',
              'project_wse': root / 'routing/forecast_starkey_wse.json',
              'probability': root / 'forecast_v2/project_threshold_ensemble.json',
              'readiness': root / 'forecast_v2/construction_readiness.json',
              'health': root / 'diagnostics/calibration_health.json',
              'hysteresis': root / 'diagnostics/hysteresis_diagnostics.json',
              'uncertainty': root / 'diagnostics/uncertainty_sensitivity.json',
          }
          data = {}
          for name, path in files.items():
              if not path.exists():
                  raise RuntimeError(f'missing required output: {path}')
              data[name] = json.loads(path.read_text())

          if data['ensemble'].get('official_outlook', {}).get('status') != 'operational_geps_integrated':
              raise RuntimeError('ensemble_paths_v2 is not operational_geps_integrated')
          if data['probability'].get('status') != 'operational_project_threshold_ensemble':
              raise RuntimeError('project_threshold_ensemble is not operational')
          if data['uncertainty'].get('status') != 'operational_sensitivity_not_calibrated_probability':
              raise RuntimeError('uncertainty sensitivity output is unavailable')
          if data['transfer'].get('project_location', {}).get('river_station') != 18883:
              raise RuntimeError('transfer is not referenced to RS18883')
          if data['project_wse'].get('project_location', {}).get('river_station') != 18883:
              raise RuntimeError('project WSE is not referenced to RS18883')
          threshold = data['readiness'].get('authoritative_operational_threshold', {})
          if abs(float(threshold.get('main_floodplain_elevation_m')) - 650.20) > 0.001:
              raise RuntimeError('readiness threshold is not 650.20 m')
          if abs(float(threshold.get('calibrated_05EA002_discharge_m3s')) - 6.77) > 0.01:
              raise RuntimeError('readiness target discharge is not 6.77 m3/s')
          if int(data['readiness'].get('probabilistic_exposure', {}).get('member_count', 0)) < 20:
              raise RuntimeError('fewer than 20 ensemble members reached readiness output')

          times = []
          for name, item in data.items():
              value = item.get('generated_utc')
              if not value:
                  raise RuntimeError(f'{name} missing generated_utc')
              times.append(datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc))
          now = datetime.now(timezone.utc)
          if any((now - value).total_seconds() > 6 * 3600 for value in times):
              raise RuntimeError('one or more operational outputs are older than six hours')
          if (max(times) - min(times)).total_seconds() > 3 * 3600:
              raise RuntimeError('operational output timestamps span more than three hours')
          print('Operational package integrity checks passed.')
          PY

          echo "$STATUS" > sturgeon_pipeline_output/logs/operational_validation.exitcode
          if [ "$STATUS" = "0" ]; then
            echo 'Operational package validation passed.' | tee -a sturgeon_pipeline_output/logs/operational_validation.log
          else
            echo 'Operational package validation failed.' | tee -a sturgeon_pipeline_output/logs/operational_validation.log
          fi
      - name: Prepare latest operational output
        if: ${{ always() && !cancelled() }}
        run: |
          rm -rf output/latest
          mkdir -p output/latest
          if [ -d sturgeon_pipeline_output ]; then
            rsync -a --exclude='sturgeon_pipeline_latest.zip' sturgeon_pipeline_output/ output/latest/
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > output/latest/workflow_completed_utc.txt
          if [ "$(cat output/latest/logs/operational_validation.exitcode 2>/dev/null || echo 1)" = "0" ]; then
            echo operational > output/latest/workflow_mode.txt
          else
            echo degraded > output/latest/workflow_mode.txt
          fi
      - name: Upload operational package
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sturgeon-operational-latest
          path: output/latest
          retention-days: 14
          if-no-files-found: warn
      - name: Commit latest operational outputs
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -rf /tmp/sturgeon-operational-latest
          cp -a output/latest /tmp/sturgeon-operational-latest

          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main
            rm -rf output/latest
            cp -a /tmp/sturgeon-operational-latest output/latest
            git add -f output/latest

            if git diff --cached --quiet; then
              echo 'No operational output changes to publish.'
              break
            fi

            git commit -m 'Update Sturgeon operational forecast [skip ci]'
            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" = "4" ]; then
              echo 'Unable to publish operational output after four attempts.' >&2
              exit 1
            fi
            echo 'Another run updated main first; retrying from the new branch head.'
            sleep $((attempt * 2))
          done
      - name: Enforce operational validation
        if: ${{ always() && !cancelled() }}
        run: |
          test "$(cat output/latest/logs/operational_validation.exitcode 2>/dev/null || echo 1)" = "0"
