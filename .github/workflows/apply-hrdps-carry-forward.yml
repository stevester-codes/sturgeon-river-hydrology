name: Apply bounded HRDPS carry-forward

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apply_hrdps_carry_forward_patch.py'
      - '.github/workflows/apply-hrdps-carry-forward.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python apply_hrdps_carry_forward_patch.py
      - name: Compile patched source
        run: python -m py_compile forecast_impacts_v2.py
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast_impacts_v2.py
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'Carry forward recent complete HRDPS during publication gaps'
            git push origin HEAD:main
          fi
