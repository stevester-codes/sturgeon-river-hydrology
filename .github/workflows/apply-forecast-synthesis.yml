name: Apply forecast synthesis migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-forecast-synthesis.yml'
      - 'patch_forecast_synthesis_workflow.py'
      - 'forecast_synthesis.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-forecast-synthesis-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile synthesis code
        run: python -m py_compile forecast_synthesis.py patch_forecast_synthesis_workflow.py
      - name: Patch operational workflow
        run: python patch_forecast_synthesis_workflow.py
      - name: Commit production workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sturgeon-operational.yml
          if git diff --cached --quiet; then
            echo 'Operational workflow already migrated.'
            exit 0
          fi
          git commit -m 'Integrate coherent forecast synthesis and atomic publication'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

# Trigger after workflow registration on the default branch.
