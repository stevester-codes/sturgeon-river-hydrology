name: Sturgeon historical response refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Sturgeon historical archive probes']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sturgeon-historical-response-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore historical rainfall caches
        uses: actions/cache@v4
        with:
          path: |
            archive_cache
            grid_cache/basins
          key: sturgeon-historical-events-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sturgeon-historical-events-${{ runner.os }}-
            sturgeon-historical-rdpa-${{ runner.os }}-
            sturgeon-historical-rdpa-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile complete historical chain
        run: |
          python -m py_compile \
            historical_response_refresh.py \
            historical_spatial_event_backfill.py \
            historical_spatial_peak_reanalysis.py \
            historical_response_target_diagnostics.py \
            historical_censored_response_model.py
      - name: Run historical response chain sequentially
        run: python historical_response_refresh.py
      - name: Upload historical response results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sturgeon-historical-response-refresh
          path: output/historical_event_backfill
          retention-days: 30
          if-no-files-found: warn
      - name: Publish historical response results once
        if: ${{ always() && !cancelled() }}
        run: |
          test -f output/historical_event_backfill/historical_response_refresh_status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/sturgeon-historical-event-backfill
          cp -a output/historical_event_backfill /tmp/sturgeon-historical-event-backfill
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf output/historical_event_backfill
            mkdir -p output
            cp -a /tmp/sturgeon-historical-event-backfill output/historical_event_backfill
            git add -f output/historical_event_backfill
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'Update historical response refresh [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
