name: Sturgeon operational update detector

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'operational_update_probe.py'
      - 'apply_workflow_orchestration_fix.py'
      - '.github/workflows/sturgeon-update-probe.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: sturgeon-operational-update-detector
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply pending orchestration migration once
        run: |
          if grep -q "cron: '17 \* \* \* \*'" .github/workflows/sturgeon-operational.yml; then
            python apply_workflow_orchestration_fix.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/sturgeon-operational.yml \
              .github/workflows/sturgeon-historical-response-shadow.yml \
              .github/workflows/sturgeon-historical-event-backfill.yml \
              .github/workflows/sturgeon-historical-peak-reanalysis.yml \
              .github/workflows/sturgeon-historical-target-diagnostics.yml \
              .github/workflows/sturgeon-historical-censored-response.yml
            git commit -m 'Consolidate Sturgeon workflow orchestration [skip ci]'
            git push origin HEAD:main
          else
            echo 'Orchestration migration is already applied.'
          fi
      - name: Install lightweight dependency
        run: pip install requests
      - name: Check upstream observations and complete weather cycles
        id: probe
        run: |
          python operational_update_probe.py \
            --published-root output/latest \
            --json-output update_probe.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Show detector result
        run: cat update_probe.json
      - name: Dispatch forecast when fresh source data are ready
        if: steps.probe.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          ACTIVE=$(gh run list \
            --workflow sturgeon-operational.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")] | length')
          if [ "$ACTIVE" != "0" ]; then
            echo "An operational run is already active; the next ten-minute probe will recheck source freshness."
            exit 0
          fi
          echo "Dispatching operational forecast: $REASON"
          gh workflow run sturgeon-operational.yml -f trigger_reason="$REASON"
