name: Apply synthesis caution refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-synthesis-caution.yml'
      - 'patch_forecast_synthesis_caution.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-synthesis-caution
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refinement
        run: python patch_forecast_synthesis_caution.py
      - name: Compile refined synthesis
        run: python -m py_compile forecast_synthesis.py
      - name: Commit refined synthesis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast_synthesis.py
          git commit -m 'Surface material historical rain-response disagreement' || exit 0
          git pull --rebase origin main
          git push

# Trigger after workflow registration on the default branch.
